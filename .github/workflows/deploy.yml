name: Auto Deploy Discord Bot

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Google Cloud VM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            echo "=================================================="
            echo "🚀 Deploying Platform Discord Bot Worker..."
            echo "=================================================="

            DEPLOY_PATH="${{ secrets.VM_DEPLOY_PATH || '$HOME/Documents/MCS-deployment' }}"
            REPO_PATH="$HOME/Documents/mcs-bot-worker"

            if [ -d "$REPO_PATH" ]; then
              echo "Pulling latest code in $REPO_PATH..."
              cd "$REPO_PATH"
              git pull origin main
              npm ci
              npm run build
              echo "Deploying slash commands to Discord..."
              npm run deploy:commands
            fi

            if [ -d "$DEPLOY_PATH" ]; then
              echo "Updating Docker container in $DEPLOY_PATH..."
              cd "$DEPLOY_PATH"
              docker compose build --build-arg CACHEBUST=$(date +%s) bot
              docker compose up -d --no-deps bot
            fi

            echo "✅ Discord Bot Worker successfully deployed and restarted."
